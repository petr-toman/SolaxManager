services:
  datastore:
    ports:
      - "${POSTGRES_DEV_PORT:-5432}:5432"

  solax_reader:
    environment:
      APP_ENV: development
    volumes:
      - ./solax_reader/src:/app:ro

  azrouter_reader:
    environment:
      APP_ENV: development
    volumes:
      - ./azrouter_reader/src:/app:ro

  solar_forecast_reader:
    environment:
      APP_ENV: development
    volumes:
      - ./solar_forecast_reader/src:/app:ro

  reporter:
    environment:
      APP_ENV: development
    volumes:
      - ./reporter/src:/app:ro

  telemetry_api:
    environment:
      APP_ENV: development
    volumes:
      - ./telemetry_api/src:/app:ro

  controller:
    environment:
      APP_ENV: development
      CONTROLLER_MODE: dry-run
    ports:
      - "127.0.0.1:${CONTROLLER_DEV_PORT:-8090}:${CONTROLLER_PORT:-8090}"
    volumes:
      - ./controller/src:/app:ro

  ui:
    volumes:
      - ./ui/src:/usr/share/nginx/html:ro
