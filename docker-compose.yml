services:
  datastore:
    build:
      context: ./datastore
    container_name: solaxmanager-datastore
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solaxmanager}
      POSTGRES_USER: ${POSTGRES_USER:-solax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solax_dev_only}
    volumes:
      - solaxmanager_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solax} -d ${POSTGRES_DB:-solaxmanager}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  solax_reader:
    build:
      context: ./solax_reader
    container_name: solaxmanager-solax-reader
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-solax}:${POSTGRES_PASSWORD:-solax_dev_only}@datastore:5432/${POSTGRES_DB:-solaxmanager}
      SOLAX_URL: ${SOLAX_URL:-http://192.168.1.20}
      SOLAX_PASSWORD: ${SOLAX_PASSWORD:-}
      READER_BASE_INTERVAL_SECONDS: ${READER_BASE_INTERVAL_SECONDS:-5}
      SOLAX_REALTIME_EVERY_N_LOOPS: ${SOLAX_REALTIME_EVERY_N_LOOPS:-1}
      SOLAX_CONFIG_EVERY_N_LOOPS: ${SOLAX_CONFIG_EVERY_N_LOOPS:-12}
    depends_on:
      datastore:
        condition: service_healthy
    restart: unless-stopped

  azrouter_reader:
    build:
      context: ./azrouter_reader
    container_name: solaxmanager-azrouter-reader
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-solax}:${POSTGRES_PASSWORD:-solax_dev_only}@datastore:5432/${POSTGRES_DB:-solaxmanager}
      AZROUTER_URL: ${AZROUTER_URL:-http://192.168.1.21}
      READER_BASE_INTERVAL_SECONDS: ${READER_BASE_INTERVAL_SECONDS:-5}
      AZROUTER_POWER_EVERY_N_LOOPS: ${AZROUTER_POWER_EVERY_N_LOOPS:-1}
      AZROUTER_DEVICES_EVERY_N_LOOPS: ${AZROUTER_DEVICES_EVERY_N_LOOPS:-3}
      AZROUTER_CONFIG_EVERY_N_LOOPS: ${AZROUTER_CONFIG_EVERY_N_LOOPS:-12}
    depends_on:
      datastore:
        condition: service_healthy
    restart: unless-stopped

  solar_forecast_reader:
    build:
      context: ./solar_forecast_reader
    container_name: solaxmanager-solar-forecast-reader
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-solax}:${POSTGRES_PASSWORD:-solax_dev_only}@datastore:5432/${POSTGRES_DB:-solaxmanager}
      SOLAR_FORECAST_LAT: ${SOLAR_FORECAST_LAT:-}
      SOLAR_FORECAST_LON: ${SOLAR_FORECAST_LON:-}
      SOLAR_PANEL_TILT_DEG: ${SOLAR_PANEL_TILT_DEG:-}
      SOLAR_PANEL_AZIMUTH_DEG: ${SOLAR_PANEL_AZIMUTH_DEG:-}
      SOLAR_FORECAST_BASE_INTERVAL_SECONDS: ${SOLAR_FORECAST_BASE_INTERVAL_SECONDS:-300}
      OPENMETEO_EVERY_N_LOOPS: ${OPENMETEO_EVERY_N_LOOPS:-12}
      OPENMETEO_FORECAST_HOURS: ${OPENMETEO_FORECAST_HOURS:-72}
    depends_on:
      datastore:
        condition: service_healthy
    restart: unless-stopped

  reporter:
    build:
      context: ./reporter
    container_name: solaxmanager-reporter
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-solax}:${POSTGRES_PASSWORD:-solax_dev_only}@datastore:5432/${POSTGRES_DB:-solaxmanager}
      REPORT_INTERVAL_SECONDS: ${REPORT_INTERVAL_SECONDS:-60}
      REPORTER_MAX_INTEGRATION_GAP_SECONDS: ${REPORTER_MAX_INTEGRATION_GAP_SECONDS:-120}
      REPORTER_RECALCULATE_PERIODS: ${REPORTER_RECALCULATE_PERIODS:-8}
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-30}
    depends_on:
      datastore:
        condition: service_healthy
    restart: unless-stopped

  telemetry_api:
    build:
      context: ./telemetry_api
    container_name: solaxmanager-telemetry-api
    environment:
      PGHOST: datastore
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-solaxmanager}
      PGUSER: ${POSTGRES_USER:-solax}
      PGPASSWORD: ${POSTGRES_PASSWORD:-solax_dev_only}
      TELEMETRY_STALE_AFTER_SECONDS: ${TELEMETRY_STALE_AFTER_SECONDS:-15}
      TELEMETRY_FORECAST_HOURS: ${TELEMETRY_FORECAST_HOURS:-8}
    depends_on:
      datastore:
        condition: service_healthy
    restart: unless-stopped

  controller:
    build:
      context: ./controller
    container_name: solaxmanager-controller
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-solax}:${POSTGRES_PASSWORD:-solax_dev_only}@datastore:5432/${POSTGRES_DB:-solaxmanager}
      SOLAX_URL: ${SOLAX_URL:-http://192.168.1.20}
      SOLAX_PASSWORD: ${SOLAX_PASSWORD:-}
      SOLAX_HTTP_TIMEOUT_SECONDS: ${SOLAX_HTTP_TIMEOUT_SECONDS:-5}
      AZROUTER_URL: ${AZROUTER_URL:-http://192.168.1.21}
      AZROUTER_USERNAME: ${AZROUTER_USERNAME:-}
      AZROUTER_PASSWORD: ${AZROUTER_PASSWORD:-}
      AZROUTER_HTTP_TIMEOUT_SECONDS: ${AZROUTER_HTTP_TIMEOUT_SECONDS:-5}
      CONTROLLER_MODE: ${CONTROLLER_MODE:-dry-run}
      CONTROLLER_HOST: 0.0.0.0
      CONTROLLER_PORT: ${CONTROLLER_PORT:-8090}
      CONTROLLER_LOG_LEVEL: ${CONTROLLER_LOG_LEVEL:-info}
    depends_on:
      datastore:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; p=os.getenv('CONTROLLER_PORT','8090'); urllib.request.urlopen(f'http://127.0.0.1:{p}/health', timeout=2).read()\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ui:
    build:
      context: ./ui
    container_name: solaxmanager-ui
    ports:
      - "${UI_PORT:-8088}:80"
    depends_on:
      - telemetry_api
    restart: unless-stopped

volumes:
  solaxmanager_pgdata:
